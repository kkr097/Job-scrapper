services:
  - type: web
    name: kk-jobs
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "cover_letter_web:create_application()" --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: COVER_LETTER_ADMIN_PASSWORD_HASH
        sync: false
      - key: COVER_LETTER_SECRET_KEY
        generateValue: true
      - key: COVER_LETTER_SYNC_TOKEN
        sync: false
      - key: COVER_LETTER_SYNC_TOKEN_SANDRA
        sync: false
